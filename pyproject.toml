[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "qlivecell"
version = "0.1.0"
description = "A Python framework for quantitative live-cell imaging, segmentation, tracking, and single-cell analysis."
authors = [
  { name = "Example Author", email = "author@example.com" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.26",
    "cellpose>=2",
    "stardist>=0.9.2",
    "csbdeep>=0.8.2",
    "matplotlib>=3.9",
    "scikit-learn",
    "scipy",
    "tifffile",
    "munkres==1.1.4",
    "scikit-image>=0.24",
    "numba",
    "napari[all]",
]

[project.optional-dependencies]
tensorflow = ["tensorflow==2.22.0rc1"]
cuda12 = ["tensorflow[and-cuda]==2.22.0rc1"]
cuda13 = ["tensorflow-cuda13[and-cuda]==2.22.0rc1"]

[project.urls]
"Homepage" = "https://github.com/dsb-lab/qlivecell"
"Bug Tracker" = "https://github.com/dsb-lab/qlivecell/issues"
