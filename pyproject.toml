[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qlivecell"
version = "0.1.0"
description = "A Python framework for quantitative live-cell imaging, segmentation, tracking, and single-cell analysis."
authors = [
  { name = "Dynamical Systems Biology lab at UPF" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.9",
    "scikit-learn",
    "scipy",
    "tifffile",
    "munkres>=1.1.4",
    "scikit-image>=0.24",
    "numba>=0.60",
]

[project.optional-dependencies]
cellpose = ["cellpose>=2"]
stardist = ["stardist>=0.9.2", "csbdeep>=0.8.2"]
qt = ["PyQt6"]
napari = ["napari>=0.5", "PyQt6"]
tensorflow = ["tensorflow>=2.18"]
cuda12 = ["tensorflow[and-cuda]>=2.18; sys_platform == 'linux'"]
cuda13 = ["tensorflow-cuda13[and-cuda]>=2.22.0rc1; sys_platform == 'linux'"]

[project.urls]
"Homepage" = "https://github.com/dsb-lab/qlivecell"
"Bug Tracker" = "https://github.com/dsb-lab/qlivecell/issues"

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]
